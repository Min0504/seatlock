name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-nest:
    name: backend-nest (lint + test)
    runs-on: ubuntu-latest
    # 러너 이상으로 잡이 행에 걸리면 빠르게 실패시킨다 (정상 소요는 ~2분)
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-nest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-nest/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: Prisma Client 생성
        run: npx prisma generate

      - name: 린트
        run: npm run lint

      - name: 빌드
        run: npm run build

      - name: 단위 테스트
        run: npm test

      - name: e2e 테스트 (Testcontainers)
        run: npm run test:e2e

  backend-spring:
    name: backend-spring (build + test)
    runs-on: ubuntu-latest
    # 러너 이상으로 잡이 행에 걸리면 빠르게 실패시킨다 (정상 소요는 ~2분)
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드 + 통합 테스트 (Testcontainers)
        run: ./gradlew build

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 타입체크 + 빌드
        run: npm run build
